<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IOAI Tracker — 24 Minggu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#080d1f; --bg2:#0d1430; --panel:#101938; --panel2:#141f45;
  --border:rgba(148,163,184,.14); --border-strong:rgba(148,163,184,.28);
  --text:#e7ecf7; --text-dim:#8d9ab8; --text-dimmer:#5f6d8c;
  --cyan:#2fd6e8; --green:#39e0a4; --coral:#ff7a63; --amber:#ffbd54; --violet:#a48bfb;
  --mandatory:#ff7a63; --mandatory-bg:rgba(255,122,99,.10); --mandatory-border:rgba(255,122,99,.38);
  --radius:14px; --radius-sm:9px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --font-head:'Sora',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f6fb; --bg2:#eef1f9; --panel:#ffffff; --panel2:#f7f9fd;
    --border:rgba(15,23,42,.10); --border-strong:rgba(15,23,42,.18);
    --text:#131b34; --text-dim:#4b5674; --text-dimmer:#8592ad;
    --mandatory-bg:rgba(255,122,99,.08);
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#eef1f9; --panel:#ffffff; --panel2:#f7f9fd;
  --border:rgba(15,23,42,.10); --border-strong:rgba(15,23,42,.18);
  --text:#131b34; --text-dim:#4b5674; --text-dimmer:#8592ad;
  --mandatory-bg:rgba(255,122,99,.08);
  color-scheme: light;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:var(--font-body);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; letter-spacing:-.01em;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
textarea,input,select{font-family:var(--font-body);}
a{color:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}

/* ---------- Layout shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.shell{display:flex; flex:1; min-height:0;}
.sidebar{
  width:216px; flex:none; border-right:1px solid var(--border);
  padding:18px 12px; display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; align-self:flex-start; height:100vh;
}
.side-link{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--text-dim); font-size:14.5px; font-weight:500; background:none; border:none; text-align:left; width:100%;
}
.side-link .ic{font-size:17px; width:20px; text-align:center;}
.side-link.active{background:var(--panel2); color:var(--text); box-shadow:inset 0 0 0 1px var(--border);}
.side-link:hover:not(.active){background:var(--panel); color:var(--text);}
main{flex:1; min-width:0; padding:22px 26px 100px; max-width:1180px; margin:0 auto; width:100%;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
}
.brand{display:flex; flex-direction:column; gap:1px;}
.brand b{font-family:var(--font-head); font-size:16.5px; font-weight:700;}
.brand span{font-size:12px; color:var(--text-dim);}
.top-actions{display:flex; align-items:center; gap:8px; position:relative;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--panel);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:16px;
}
.icon-btn:hover{color:var(--text); border-color:var(--border-strong);}
.menu-pop{
  position:absolute; top:44px; right:0; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius-sm); box-shadow:var(--shadow); min-width:190px; padding:6px; display:none; z-index:40;
}
.menu-pop.open{display:block;}
.menu-pop button{
  width:100%; text-align:left; background:none; border:none; color:var(--text); padding:9px 10px;
  border-radius:8px; font-size:13.5px; display:flex; align-items:center; gap:8px;
}
.menu-pop button:hover{background:var(--panel2);}

.bottom-nav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.bottom-nav-inner{display:flex; justify-content:space-around;}
.bn-link{
  display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
  color:var(--text-dimmer); font-size:10.5px; padding:5px 8px; border-radius:10px; flex:1;
}
.bn-link .ic{font-size:19px;}
.bn-link.active{color:var(--cyan);}

/* ---------- Onboarding modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,7,18,.72); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.modal-overlay.hidden{display:none;}
.modal-card{
  background:var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow);
  max-width:440px; width:100%; padding:26px 24px; max-height:88vh; overflow:auto;
}
.modal-card h2{font-size:20px; margin-bottom:6px;}
.modal-card p.sub{color:var(--text-dim); font-size:13.5px; margin-bottom:18px; line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input[type=date]{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border-strong);
  background:var(--bg2); color:var(--text); font-size:14px;
}
.theme-choice{display:flex; gap:8px;}
.theme-opt{
  flex:1; padding:10px; border-radius:10px; border:1px solid var(--border-strong); background:var(--bg2);
  color:var(--text-dim); font-size:13px; text-align:center; font-weight:600;
}
.theme-opt.selected{border-color:var(--cyan); color:var(--cyan); background:rgba(47,214,232,.08);}
.btn{
  border:none; border-radius:11px; padding:12px 18px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--green)); color:#04121a; width:100%;}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Cards / generic ---------- */
.section-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dimmer); margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}

/* Dashboard stat cards */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.stat-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.stat-card .ic{font-size:20px; margin-bottom:8px;}
.stat-card .num{font-family:var(--font-head); font-size:26px; font-weight:700; line-height:1;}
.stat-card .lbl{color:var(--text-dim); font-size:12px; margin-top:5px;}

.pace-badge{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); font-size:13px; font-weight:600; margin-top:14px;}

.phase-bars{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.phase-bar-row{display:flex; align-items:center; gap:10px;}
.phase-bar-label{width:132px; flex:none; font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:5px;}
.phase-bar-track{flex:1; height:9px; background:var(--bg2); border-radius:6px; overflow:hidden; border:1px solid var(--border);}
.phase-bar-fill{height:100%; border-radius:6px; transition:width .5s ease;}
.phase-bar-pct{width:38px; text-align:right; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
.focus-tag{font-size:9.5px; background:rgba(57,224,164,.14); color:var(--green); border-radius:5px; padding:1px 5px; font-weight:700;}

/* Timeline */
.phase-divider{display:flex; align-items:center; gap:10px; margin:22px 0 10px;}
.phase-divider:first-child{margin-top:0;}
.phase-divider .line{flex:1; height:1px; background:var(--border);}
.phase-divider .lbl{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); white-space:nowrap;}
.week-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
.week-card{
  position:relative; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; min-height:128px; display:flex; flex-direction:column; gap:8px;
}
.week-card.state-current{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan), 0 0 18px rgba(47,214,232,.18);}
.week-card.state-done{opacity:.72;}
.week-card .wk-top{display:flex; align-items:flex-start; justify-content:space-between;}
.week-card .wk-num{font-family:var(--font-head); font-size:22px; font-weight:800; line-height:1;}
.week-card .flag{font-size:16px;}
.week-card .wk-theme{font-size:12.5px; color:var(--text-dim); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em;}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; width:fit-content;}
.wk-mini-track{height:6px; border-radius:5px; background:var(--bg2); overflow:hidden; border:1px solid var(--border); margin-top:auto;}
.wk-mini-fill{height:100%; border-radius:5px;}
.wk-done-check{position:absolute; top:10px; right:10px; font-size:15px;}

.week-expand{margin:6px 0 16px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--bg2);}
.day-row{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--border);
  background:var(--panel);
}
.day-row:first-child{border-top:none;}
.day-row .dr-name{width:64px; flex:none; font-weight:700; font-size:12.5px;}
.day-row .dr-date{width:70px; flex:none; font-size:11px; color:var(--text-dimmer);}
.day-row .dr-topic{flex:1; font-size:12.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.day-row .dr-status{font-size:14px; flex:none;}
.week-expand-close{width:100%; text-align:center; padding:9px; font-size:12px; color:var(--text-dim); background:var(--panel2); border:none; border-top:1px solid var(--border);}
.day-detail-wrap{border-top:1px solid var(--border);}

/* Day card */
.daycard{display:grid; grid-template-columns:1.15fr .85fr; gap:18px;}
@media (max-width:860px){.daycard{grid-template-columns:1fr;}}
.dc-col{display:flex; flex-direction:column; gap:14px;}
.dc-header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.dc-header h3{font-size:17px;}
.dc-duration{font-size:11.5px; color:var(--text-dim); background:var(--panel2); padding:3px 9px; border-radius:999px; border:1px solid var(--border);}
.checklist{display:flex; flex-direction:column; gap:2px;}
.check-row{display:flex; align-items:flex-start; gap:10px; padding:9px 8px; border-radius:9px; cursor:pointer;}
.check-row:hover{background:var(--panel2);}
.check-box{
  width:19px; height:19px; border-radius:6px; border:2px solid var(--border-strong); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; background:var(--bg2);
}
.check-row.checked .check-box{background:var(--green); border-color:var(--green); color:#04241a;}
.check-row.checked .check-text{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border-strong);}
.check-text{font-size:13.5px; line-height:1.45;}
.output-box{font-size:12.5px; color:var(--text-dim); background:var(--panel2); border:1px dashed var(--border-strong); border-radius:10px; padding:10px 12px; line-height:1.5;}
.notes-area{
  width:100%; min-height:88px; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-size:13px; padding:10px 12px; resize:vertical; line-height:1.5;
}
.mandatory-card{
  border:1px solid var(--mandatory-border); background:var(--mandatory-bg); border-radius:var(--radius);
  padding:14px; display:flex; flex-direction:column; gap:10px;
}
.mandatory-top{display:flex; align-items:center; gap:8px;}
.mandatory-badge{background:var(--mandatory); color:#2a0c06; font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; letter-spacing:.03em;}
.mandatory-name{font-size:13.5px; font-weight:600; line-height:1.4;}
.manual-badge{font-size:9.5px; font-weight:700; color:var(--amber); background:rgba(255,189,84,.12); padding:2px 6px; border-radius:5px;}
.mandatory-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.btn-sm{padding:8px 12px; border-radius:9px; font-size:12.5px; font-weight:700;}
.btn-open{background:var(--panel); color:var(--text); border:1px solid var(--border-strong);}
.mandatory-read-toggle{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); cursor:pointer; padding:6px 10px; border-radius:9px; background:var(--panel);}
.mandatory-read-toggle.on{color:var(--green); background:rgba(57,224,164,.1);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media (max-width:520px){.opt-grid{grid-template-columns:1fr;}}
.opt-chip{
  position:relative; display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--panel2);
  border-radius:10px; padding:9px 10px; font-size:12px; text-align:left;
}
.opt-chip .oc-ic{font-size:15px; flex:none;}
.opt-chip .oc-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.opt-chip.seen{border-color:rgba(57,224,164,.4);}
.opt-chip .oc-flag{position:absolute; top:5px; right:6px; font-size:10px;}
.complete-btn{
  width:100%; padding:14px; border-radius:12px; font-weight:800; font-size:14px; border:none;
  background:linear-gradient(135deg,var(--cyan),var(--green)); color:#04121a;
}
.complete-btn:disabled{background:var(--panel2); color:var(--text-dimmer); cursor:not-allowed;}
.complete-btn.done{background:rgba(57,224,164,.14); color:var(--green); border:1px solid rgba(57,224,164,.4);}
.holiday-toggle{font-size:11.5px; color:var(--text-dim); background:none; border:1px dashed var(--border-strong); border-radius:8px; padding:6px 9px;}
.tooltip-hint{font-size:11px; color:var(--text-dimmer); margin-top:6px; text-align:center;}

.quiz-block, .checkpoint-block{margin-top:18px; border-top:1px solid var(--border); padding-top:16px;}
.quiz-q{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px;}
.quiz-q .hint{display:none; color:var(--text-dim); font-size:12px; margin-top:6px; border-top:1px dashed var(--border); padding-top:6px;}
.quiz-q.revealed .hint{display:block;}
.quiz-score-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
.quiz-score-row input{width:70px; padding:8px; border-radius:8px; border:1px solid var(--border-strong); background:var(--bg2); color:var(--text);}
.cp-q{margin-bottom:12px;}
.cp-q label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px;}
.cp-q textarea{width:100%; min-height:60px; background:var(--panel2); border:1px solid var(--border); border-radius:9px; color:var(--text); padding:8px 10px; font-size:13px;}
.cp-status-row{display:flex; gap:10px; margin:10px 0;}
.cp-status-opt{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border-strong); text-align:center; font-size:12.5px; font-weight:700; background:var(--panel2); color:var(--text-dim);}
.cp-status-opt.selected.ready{border-color:var(--green); color:var(--green); background:rgba(57,224,164,.1);}
.cp-status-opt.selected.remedial{border-color:var(--amber); color:var(--amber); background:rgba(255,189,84,.1);}
.cp-remedial-box{background:rgba(255,189,84,.08); border:1px solid rgba(255,189,84,.3); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-top:10px; line-height:1.6;}
.cp-readonly{opacity:.85;}

/* Today view preview strip */
.preview-strip{display:flex; gap:10px; margin-bottom:16px;}
.preview-card{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
.preview-card .pv-lbl{font-size:10.5px; color:var(--text-dimmer); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.preview-card .pv-topic{font-size:12.5px; margin-top:4px; line-height:1.35;}
.preview-card .pv-status{font-size:11px; margin-top:6px; color:var(--text-dim);}
@media (max-width:520px){.preview-strip{flex-direction:column;}}

/* Sources view */
.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.filter-bar select, .filter-bar input[type=text]{
  padding:9px 11px; border-radius:9px; border:1px solid var(--border-strong); background:var(--panel); color:var(--text); font-size:12.5px;
}
.filter-bar input[type=text]{flex:1; min-width:160px;}
.toggle-pill{display:flex; align-items:center; gap:6px; padding:9px 12px; border-radius:9px; border:1px solid var(--border-strong); background:var(--panel); font-size:12.5px; color:var(--text-dim);}
.toggle-pill.active{border-color:var(--amber); color:var(--amber); background:rgba(255,189,84,.08);}
.reading-list{background:var(--panel2); border:1px solid var(--border-strong); border-radius:var(--radius); padding:14px; margin-bottom:18px;}
.reading-list h4{font-size:13px; margin-bottom:10px;}
.source-row{display:flex; align-items:center; gap:10px; padding:9px 6px; border-radius:8px; font-size:12.5px; border-bottom:1px solid var(--border);}
.source-row:last-child{border-bottom:none;}
.source-row .sr-ic{flex:none;}
.source-row .sr-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.source-row .sr-loc{flex:none; color:var(--text-dimmer); font-size:11px; background:var(--bg2); padding:2px 7px; border-radius:6px;}
.source-list{display:flex; flex-direction:column; gap:2px;}
.empty-msg{color:var(--text-dimmer); font-size:13px; padding:20px 10px; text-align:center;}

/* Stats view */
.chart-wrap{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:20px; height:260px;}
.cp-history-item{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer;}
.cp-history-item .cph-top{display:flex; justify-content:space-between; align-items:center;}
.cp-history-item .cph-week{font-weight:700; font-size:13.5px;}
.cp-history-item .cph-date{font-size:11.5px; color:var(--text-dimmer);}
.cp-history-detail{display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:10px;}
.cp-history-item.open .cp-history-detail{display:block;}

/* Modal (source hint) */
.mini-modal{max-width:340px;}
.copy-hint-btn{margin-top:12px;}

/* view visibility */
.view{display:none;}
.view.active{display:block;}

.pill-row{display:flex; gap:8px; flex-wrap:wrap;}

/* Reminder toast */
.sync-chip{font-size:11.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--panel2);color:var(--text-dim);white-space:nowrap;min-height:32px}
.sync-chip.ok{color:#39e0a4}.sync-chip.off{color:#fb923c}
.btn-cloud{width:100%;min-height:44px;margin-top:8px}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel);
  border:1px solid var(--border-strong); border-radius:12px; padding:12px 16px; font-size:12.5px;
  box-shadow:var(--shadow); z-index:300; max-width:90vw; display:flex; align-items:center; gap:10px;
}
.toast button{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:11.5px; color:var(--text);}

/* ---------- Ambient background ---------- */
.bg-ambient{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
.bg-blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:.22; will-change:transform;}
.bg-blob.b1{width:420px; height:420px; background:var(--cyan); top:-120px; left:-100px; animation:drift1 26s ease-in-out infinite;}
.bg-blob.b2{width:480px; height:480px; background:var(--green); bottom:-160px; right:-140px; animation:drift2 32s ease-in-out infinite;}
.bg-blob.b3{width:320px; height:320px; background:var(--violet); top:40%; right:10%; animation:drift3 22s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-60px);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,50px) scale(1.1);}}
@media (prefers-reduced-motion: reduce){ .bg-blob{animation:none !important;} }

/* ---------- View transition ---------- */
.view.active{animation:viewIn .32s ease both;}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Avatar ---------- */
.avatar{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-weight:700; font-size:13px; color:#04121a;
  background:linear-gradient(135deg,var(--cyan),var(--green)); flex:none;
}

/* ---------- Hero progress card ---------- */
.hero-card{
  display:flex; align-items:center; gap:20px; background:linear-gradient(135deg,var(--panel),var(--panel2));
  border:1px solid var(--border); border-radius:18px; padding:20px; margin-bottom:16px; flex-wrap:wrap;
  position:relative; overflow:hidden;
}
.hero-ring{position:relative; width:112px; height:112px; flex:none;}
.hero-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.hero-ring .ring-bg{fill:none; stroke:var(--border-strong); stroke-width:9;}
.hero-ring .ring-fg{fill:none; stroke:url(#ringGrad); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.hero-ring .ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.hero-ring .ring-label b{font-family:var(--font-head); font-size:22px;}
.hero-ring .ring-label span{font-size:10px; color:var(--text-dim);}
.hero-info{flex:1; min-width:180px;}
.hero-greeting{font-family:var(--font-head); font-size:18px; font-weight:700;}
.hero-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}

/* ---------- Heatmap ---------- */
.heatmap-scroll{overflow-x:auto; padding-bottom:8px;}
.heatmap{display:inline-flex; gap:3px;}
.hm-col{display:flex; flex-direction:column; gap:3px;}
.hm-cell{
  width:12px; height:12px; border-radius:3px; border:1px solid var(--border); background:var(--bg2); padding:0;
  transition:transform .15s ease;
}
.hm-cell:hover{transform:scale(1.35); position:relative; z-index:5;}
.hm-cell.hm-done{background:var(--phase-color); border-color:var(--phase-color);}
.hm-cell.hm-holiday{background:repeating-linear-gradient(45deg, var(--amber), var(--amber) 2px, transparent 2px, transparent 4px); border-color:var(--amber);}
.hm-cell.hm-today{box-shadow:0 0 0 2px var(--cyan);}
.heatmap-legend{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; font-size:11px; color:var(--text-dim);}
.heatmap-legend span{display:inline-flex; align-items:center; gap:5px;}
.heatmap-legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}

/* ---------- Badges ---------- */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px;}
.badge-item{
  background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 10px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
.badge-item .b-ic{font-size:26px; filter:grayscale(1); opacity:.35;}
.badge-item.unlocked{border-color:var(--border-strong); box-shadow:0 0 0 1px rgba(47,214,232,.25), 0 0 16px rgba(47,214,232,.12);}
.badge-item.unlocked .b-ic{filter:none; opacity:1;}
.badge-item .b-title{font-size:11px; color:var(--text-dim); line-height:1.3;}
.badge-item.unlocked .b-title{color:var(--text);}

/* ---------- Timeline search ---------- */
.timeline-search{display:flex; gap:8px; margin-bottom:16px;}
.timeline-search input{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border-strong); background:var(--panel); color:var(--text); font-size:13px;}

/* ---------- Confetti ---------- */
.confetti-piece{position:fixed; top:-12px; z-index:300; pointer-events:none; border-radius:2px; will-change:transform,opacity;}

.card, .stat-card, .week-card{transition:transform .18s ease, box-shadow .18s ease;}
.week-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.22);}
.stat-card:hover{transform:translateY(-2px);}

/* ---------- Syllabus view ---------- */
.syllabus-note{
  background:rgba(255,189,84,.08); border:1px solid rgba(255,189,84,.3); border-radius:var(--radius);
  padding:14px 16px; font-size:12.5px; line-height:1.6; color:var(--text-dim); margin-bottom:18px;
}
.syllabus-note b{color:var(--text);}
.syllabus-note a{color:var(--cyan); text-decoration:underline;}
.syllabus-section-card{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; background:var(--panel);}
.syllabus-section-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; gap:10px;}
.syllabus-section-head h4{font-size:14px;}
.syllabus-section-head .ssh-meta{font-size:11.5px; color:var(--text-dim); flex:none;}
.syllabus-section-body{display:none; border-top:1px solid var(--border);}
.syllabus-section-card.open .syllabus-section-body{display:block;}
.syllabus-section-card.open .ssh-chevron{transform:rotate(180deg);}
.ssh-chevron{transition:transform .2s ease; color:var(--text-dimmer); flex:none;}
.syllabus-topic-group{padding:10px 16px 4px;}
.syllabus-topic-group .stg-title{font-size:11.5px; font-weight:700; color:var(--text-dimmer); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.syllabus-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:8px; font-size:12.5px; cursor:pointer;
}
.syllabus-row:hover{background:var(--panel2);}
.syllabus-row .sy-status{flex:none; width:18px; text-align:center;}
.syllabus-row .sy-name{flex:1;}
.syllabus-row .sy-cat{flex:none; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--panel2); color:var(--text-dim); border:1px solid var(--border);}
.syllabus-row .sy-jump{flex:none; font-size:10.5px; color:var(--text-dimmer); background:var(--bg2); padding:2px 8px; border-radius:6px;}
.cat-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); color:var(--text-dim);}

@media (max-width:860px){
  .sidebar{display:none;}
  main{padding:16px 14px 90px;}
  .bottom-nav{display:block;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .phase-bar-label{width:96px; font-size:11px;}
  .hero-card{flex-direction:column; text-align:center;}
}

const PHASE_COLORS = {'Fondasi':'#7A6A4F','MLKlasik':'#8A5A44','JST':'#7A5C6E','CV':'#5B7A6B','NLP':'#B5482A','Audio-RL':'#B7791F','Etika':'#9A4A4A','Writing':'#6E665B','Latihan':'#4A6A7A','Simulasi':'#8C7A2E'};

/* ================= State ================= */
function defaultState(){

let uiState = { expandedWeek:null, expandedDay:null, scrollPos:{}, sourceFilters:{phase:'',type:'',search:'',manualOnly:false}, timelineSearch:'' };

/* ================= Badges ================= */
function phaseDone(stats, phase){
  const s = stats.phaseStats[phase];
  return s && s.total > 0 && s.completed === s.total;
}
function allCheckpointsReady(){
  const vals = Object.values(appState.checkpoints);
  return vals.length > 0 && vals.every(c => c.status === 'ready');
}
const BADGES = [
  {id:'streak3',  icon:'🔥', title:'3 Hari Beruntun',       check:(s)=> s.streak>=3},
  {id:'streak7',  icon:'🔥', title:'7 Hari Beruntun',       check:(s)=> s.streak>=7},
  {id:'streak14', icon:'🔥', title:'14 Hari Beruntun',      check:(s)=> s.streak>=14},
  {id:'streak30', icon:'🔥', title:'30 Hari Beruntun',      check:(s)=> s.streak>=30},
  {id:'mand25',   icon:'🔒', title:'25 Sumber Wajib',       check:(s)=> s.stats.totalMandatoryRead>=25},
  {id:'mand75',   icon:'🔒', title:'75 Sumber Wajib',       check:(s)=> s.stats.totalMandatoryRead>=75},
  {id:'mand168',  icon:'🔒', title:'Semua Sumber Wajib',    check:(s)=> s.stats.totalMandatoryRead>=168},
  {id:'phaseFondasi', icon:'🧮', title:'Fondasi Tuntas',    check:(s)=> phaseDone(s.stats,'Fondasi')},
  {id:'phaseCV',  icon:'👁️', title:'CV Master',            check:(s)=> phaseDone(s.stats,'CV')},
  {id:'phaseNLP', icon:'💬', title:'NLP Master',            check:(s)=> phaseDone(s.stats,'NLP')},
  {id:'explorer', icon:'🌐', title:'100 Sumber Dieksplorasi', check:(s)=> s.stats.totalOptionalViewed>=100},
  {id:'readyStreak', icon:'🚩', title:'Selalu Siap Lanjut', check:(s)=> allCheckpointsReady()},
  {id:'finisher', icon:'🏆', title:'IOAI Ready!',           check:(s)=> s.stats.totalCompleted>=168},
];
function checkAndUnlockBadges(){
  const stats = computeStats();
  const streak = computeStreak();
  const ctx = { stats, streak };
  const newly = [];
  BADGES.forEach(b => {
    if(!appState.unlockedBadges.includes(b.id) && b.check(ctx)){
      appState.unlockedBadges.push(b.id);
      newly.push(b);
    }
  });
  if(newly.length){
    saveState();
    confettiBurst();
    toast('Badge baru terbuka: ' + newly.map(b=>b.icon+' '+b.title).join(', '));
  }
  return newly;
}

/* ================= Confetti (self-contained, no external deps) ================= */
function confettiBurst(){ return; /* dinonaktifkan */
  const colors = ['#2fd6e8','#39e0a4','#ffbd54','#ff7a63','#a48bfb'];
  const count = 46;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    el.style.width = size + 'px';
    el.style.height = (size*0.4) + 'px';
    el.style.background = colors[i % colors.length];
    const startX = Math.random()*window.innerWidth;
    const drift = (Math.random()-0.5) * 240;
    const duration = 1600 + Math.random()*900;
    const rotate = Math.random()*720 - 360;
    el.style.left = startX + 'px';
    el.style.opacity = '1';
    document.body.appendChild(el);
    const anim = el.animate([
      { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${drift}px, ${window.innerHeight + 40}px) rotate(${rotate}deg)`, opacity: 0.9 }
    ], { duration, easing:'cubic-bezier(.25,.46,.45,.94)' });
    anim.onfinish = () => el.remove();
  }
}

/* ================= Greeting / avatar ================= */
function greeting(){
  const h = new Date().getHours();
  let g = 'Selamat malam';
  if(h>=4 && h<10) g = 'Selamat pagi';
  else if(h>=10 && h<15) g = 'Selamat siang';
  else if(h>=15 && h<18) g = 'Selamat sore';
  return appState.userName ? g + ', ' + appState.userName : g;
}
function initialsOf(name){
  if(!name || !name.trim()) return null;
  const parts = name.trim().split(/\s+/);
  const s = parts.length > 1 ? (parts[0][0] + parts[1][0]) : parts[0].slice(0,2);
  return s.toUpperCase();
}
function updateAvatar(){
  const av = document.getElementById('headerAvatar');
  if(!av) return;
  const ini = initialsOf(appState.userName);
  av.textContent = ini || '🧠';
  av.style.fontSize = ini ? '13px' : '16px';
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      appState = Object.assign(defaultState(), parsed);
      return true;
    }
  }catch(e){ console.error('loadState error', e); }
  return false;
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  }catch(e){ console.error('saveState error', e); }
  if(window.Cloud) Cloud.onLocalSave();
}
let notesSaveTimer = null;
function saveStateDebounced(){
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(saveState, 500);
}

/* ================= Data helpers ================= */
function getWeekData(week){ return scheduleData[week-1]; }
function getDayData(week, dayIdx){ return scheduleData[week-1].days[dayIdx]; }
function progKey(week, dayIdx){ return week + '_' + dayIdx; }

function getProgress(week, dayIdx){
  const key = progKey(week, dayIdx);
  if(!appState.progress[key]){
    const d = getDayData(week, dayIdx);
    appState.progress[key] = {
      checklist: d.checklist.map(()=>false),
      mandatoryRead: false,
      optionalViewed: d.sources.optional.map(()=>false),
      notes: '',
      completed: false,
      completedAt: null,
      holiday: false,
    };
  }
  return appState.progress[key];
}

function isEligibleComplete(week, dayIdx){
  const p = getProgress(week, dayIdx);
  return p.checklist.every(Boolean) && p.mandatoryRead;
}

/* ================= Date / position helpers ================= */
function parseISODate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDateShort(d){ return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('id-ID', {weekday:'long', day:'2-digit', month:'long', year:'numeric'}); }

function daysSinceStart(){
  if(!appState.startDate) return null;
  const start = parseISODate(appState.startDate);
  const now = new Date();
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nowMid - startMid) / 86400000);
}
function globalIdxToWeekDay(idx){ return { week: Math.floor(idx/7)+1, dayIdx: idx%7 }; }
function weekDayToGlobalIdx(week, dayIdx){ return (week-1)*7 + dayIdx; }
function dateForGlobalIdx(idx){
  const start = parseISODate(appState.startDate);
  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + idx);
  return d;
}
function nextMonday(){
  const now = new Date();
  const day = now.getDay(); // 0 sun .. 6 sat
  const add = (day === 1) ? 7 : ((8 - day) % 7 || 7);
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + add);
  return d;
}
function toISODateInput(d){
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

/* ================= Stats ================= */
function computeStreak(){
  const dss = daysSinceStart();
  if(dss === null || dss < 0) return 0;
  let idx = Math.min(dss, 167);
  // If today hasn't been marked complete yet, don't let the still-open day zero out
  // the streak earned on previous days — start counting from yesterday instead.
  const todayPos = globalIdxToWeekDay(idx);
  const todayProg = getProgress(todayPos.week, todayPos.dayIdx);
  if(!todayProg.completed && !todayProg.holiday) idx -= 1;
  let count = 0;
  while(idx >= 0){
    const {week, dayIdx} = globalIdxToWeekDay(idx);
    const p = getProgress(week, dayIdx);
    if(p.holiday){ idx--; continue; }
    if(p.completed){ count++; idx--; } else break;
  }
  return count;
}

function computeStats(){
  let totalCompleted = 0, totalMandatoryRead = 0, totalOptionalSlots = 0, totalOptionalViewed = 0;
  const phaseStats = {};
  PHASE_ORDER.forEach(p => phaseStats[p] = {completed:0, total:0});
  scheduleData.forEach(w => {
    w.days.forEach((d, dIdx) => {
      const p = getProgress(w.week, dIdx);
      if(p.completed) totalCompleted++;
      if(p.mandatoryRead) totalMandatoryRead++;
      totalOptionalSlots += d.sources.optional.length;
      totalOptionalViewed += p.optionalViewed.filter(Boolean).length;
      phaseStats[w.phase].total++;
      if(p.completed) phaseStats[w.phase].completed++;
    });
  });
  return { totalCompleted, totalMandatoryRead, totalOptionalSlots, totalOptionalViewed, phaseStats };
}

function paceStatus(stats){
  const dss = daysSinceStart();
  if(dss === null) return {emoji:'⚪', label:'Belum dimulai', cls:''};
  if(dss < 0) return {emoji:'⚪', label:'Belum dimulai', cls:''};
  const expectedIdx = Math.min(dss, 167);
  let holidays = 0;
  for(let i=0;i<=expectedIdx;i++){
    const {week, dayIdx} = globalIdxToWeekDay(i);
    if(getProgress(week, dayIdx).holiday) holidays++;
  }
  const expectedCount = (expectedIdx+1) - holidays;
  const diff = expectedCount - stats.totalCompleted;
  if(diff <= 0) return {emoji:'🟢', label:'Sesuai Jadwal', cls:'ok'};
  if(diff <= 5) return {emoji:'🟡', label:'Tertinggal ' + diff + ' hari', cls:'warn'};
  return {emoji:'🔴', label:'Tertinggal ' + diff + ' hari (>5)', cls:'bad'};
}

/* ================= Theme ================= */
function applyTheme(){
  const pref = localStorage.getItem('ioai_theme_pref');
  const eff = pref || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', eff);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = eff === 'dark' ? '🌙' : '☀️';
}

/* ================= Toast ================= */
function toast(msg, withBtn){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span>' + msg + '</span>' + (withBtn ? '<button id="toastActionBtn">Export Sekarang</button>' : '') + '<button id="toastCloseBtn">✕</button>';
  document.body.appendChild(el);
  document.getElementById('toastCloseBtn').onclick = () => el.remove();
  if(withBtn){
    document.getElementById('toastActionBtn').onclick = () => { el.remove(); doExport(); };
  }
  setTimeout(()=>{ if(el.parentNode) el.remove(); }, 9000);
}

function checkBackupReminder(){
  const dss = daysSinceStart();
  if(dss === null || dss < 7) return;
  let days;
  if(appState.lastBackup){
    days = Math.floor((Date.now() - new Date(appState.lastBackup).getTime()) / 86400000);
  } else {
    days = dss;
  }
  if(days > 7){
    toast('Sudah ' + days + ' hari sejak backup terakhir.', true);
  }
}

/* ================= View switching ================= */
function switchView(view){
  const mainEl = document.querySelector('main');
  uiState.scrollPos[uiState.currentView || 'dashboard'] = mainEl ? mainEl.scrollTop : 0;
  uiState.currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.view === view));
  document.querySelectorAll('.side-link, .bn-link').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderView(view);
  requestAnimationFrame(()=>{ if(mainEl) mainEl.scrollTop = uiState.scrollPos[view] || 0; });
}

function renderView(view){
  if(view === 'dashboard') renderDashboard();
  else if(view === 'timeline') renderTimeline();
  else if(view === 'today') renderToday();
  else if(view === 'sources') renderSources();
  else if(view === 'stats') renderStats();
  else if(view === 'silabus') renderSilabus();
  updateBrand();
}

function updateBrand(){
  const sub = document.getElementById('brandSub');
  const dss = daysSinceStart();
  if(dss === null) sub.textContent = 'Belum dimulai';
  else if(dss < 0) sub.textContent = 'Mulai dalam ' + (-dss) + ' hari';
  else if(dss > 167) sub.textContent = 'Program selesai 🎉';
  else sub.textContent = 'Minggu ' + (Math.floor(dss/7)+1) + ' dari 24';
}

/* ================= Heatmap ================= */
function renderHeatmap(){
  const dss = daysSinceStart();
  const todayIdx = (dss !== null && dss >= 0 && dss <= 167) ? dss : -1;
  let cols = '';
  scheduleData.forEach(w => {
    let cells = '';
    for(let i=0;i<7;i++){
      const p = getProgress(w.week, i);
      let cls = '';
      if(p.holiday) cls = 'hm-holiday';
      else if(p.completed) cls = 'hm-done';
      const gIdx = weekDayToGlobalIdx(w.week, i);
      if(gIdx === todayIdx) cls += ' hm-today';
      const d = w.days[i];
      cells += `<button class="hm-cell ${cls}" style="--phase-color:${PHASE_COLORS[w.phase]}" data-jump-week="${w.week}" data-jump-day="${i}" title="${d.day}, Minggu ${w.week}: ${d.topic}"></button>`;
    }
    cols += `<div class="hm-col">${cells}</div>`;
  });
  return `<div class="heatmap-scroll"><div class="heatmap">${cols}</div></div>
    <div class="heatmap-legend">
      <span><i style="background:var(--bg2);border:1px solid var(--border);"></i>Belum</span>
      <span><i style="background:var(--cyan);"></i>Selesai (warna = fase)</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 2px,transparent 2px,transparent 4px);"></i>Hari Libur</span>
    </div>`;
}

/* ================= Timeline ================= */
function weekStateClass(week){
  const dss = daysSinceStart();
  if(dss !== null && dss >= 0){
    const curWeek = Math.floor(Math.min(dss,167)/7)+1;
    if(week === curWeek) return 'state-current';
  }
  let allDone = true;
  for(let i=0;i<7;i++){ const p = getProgress(week,i); if(!(p.completed || p.holiday)){ allDone = false; break; } }
  if(allDone) return 'state-done';
  return '';
}

function weekMatchesSearch(w, term){
  if(!term) return true;
  const t = term.toLowerCase();
  if(w.theme.toLowerCase().includes(t)) return true;
  return w.days.some(d => d.topic.toLowerCase().includes(t));
}

function renderTimeline(){
  const el = document.getElementById('view-timeline');
  const term = uiState.timelineSearch || '';
  let html = `<h1 style="font-size:22px;margin-bottom:4px;">Timeline 24 Minggu</h1>
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:14px;">Klik kartu minggu untuk melihat 7 hari, klik hari untuk membuka detail lengkap.</p>
    <div class="timeline-search"><input type="text" id="timelineSearchInput" placeholder="🔎 Cari topik di 24 minggu... (mis. 'ResNet', 'BERT')" value="${term.replace(/"/g,'&quot;')}"></div>`;

  let lastPhase = null;
  let gridBuffer = '';
  let anyMatch = false;
  const flushGrid = () => { if(gridBuffer){ html += `<div class="week-grid">${gridBuffer}</div>`; gridBuffer=''; } };

  scheduleData.forEach(w => {
    if(!weekMatchesSearch(w, term)) return;
    anyMatch = true;
    if(w.phase !== lastPhase){
      flushGrid();
      html += `<div class="phase-divider"><div class="lbl">${w.phase}</div><div class="line"></div></div>`;
      lastPhase = w.phase;
    }
    let completedCount = 0;
    for(let i=0;i<7;i++){ if(getProgress(w.week,i).completed) completedCount++; }
    const pct = Math.round(completedCount/7*100);
    const stateCls = weekStateClass(w.week);
    const flag = CHECKPOINT_WEEKS.includes(w.week) ? '<span class="flag">🚩</span>' : '';
    const doneCheck = stateCls==='state-done' ? '<span class="wk-done-check">✅</span>' : '';
    gridBuffer += `<button class="week-card ${stateCls}" data-week="${w.week}">
      ${doneCheck}
      <div class="wk-top"><div class="wk-num">${String(w.week).padStart(2,'0')}</div>${flag}</div>
      <div class="wk-theme">${w.theme}</div>
      <span class="badge" style="background:${PHASE_COLORS[w.phase]}22;color:${PHASE_COLORS[w.phase]};">${w.phase}</span>
      <div class="wk-mini-track"><div class="wk-mini-fill" style="width:${pct}%;background:${PHASE_COLORS[w.phase]};"></div></div>
    </button>`;
  });
  flushGrid();
  if(!anyMatch){ html += `<div class="empty-msg">Tidak ada minggu/topik yang cocok dengan "${term}".</div>`; }
  el.innerHTML = html;

  if(uiState.expandedWeek){
    const card = el.querySelector(`.week-card[data-week="${uiState.expandedWeek}"]`);
    if(card) openWeekExpand(uiState.expandedWeek, card);
  }
}

function toggleWeekExpand(week, cardEl){
  if(uiState.expandedWeek === week){
    const existing = document.querySelector('.week-expand');
    if(existing) existing.remove();
    cardEl.classList.remove('is-open');
    uiState.expandedWeek = null; uiState.expandedDay = null;
    return;
  }
  openWeekExpand(week, cardEl);
}

function openWeekExpand(week, cardEl){
  const existing = document.querySelector('.week-expand');
  if(existing) existing.remove();
  document.querySelectorAll('.week-card').forEach(c=>c.classList.remove('is-open'));
  uiState.expandedWeek = week;
  cardEl.classList.add('is-open');
  const w = getWeekData(week);
  const wrap = document.createElement('div');
  wrap.className = 'week-expand';
  let rows = '';
  w.days.forEach((d, dIdx) => {
    const globalIdx = weekDayToGlobalIdx(week, dIdx);
    const p = getProgress(week, dIdx);
    const dateStr = appState.startDate ? fmtDateShort(dateForGlobalIdx(globalIdx)) : '—';
    let status = '⬜';
    if(p.holiday) status = '📅';
    else if(p.completed) status = '✅';
    rows += `<div class="day-row" data-week="${week}" data-day="${dIdx}">
      <div class="dr-name">${d.day}</div>
      <div class="dr-date">${dateStr}</div>
      <div class="dr-topic">${d.topic}</div>
      <div class="dr-status">${status}</div>
    </div><div class="day-detail-wrap" data-detail-for="${week}_${dIdx}"></div>`;
  });
  wrap.innerHTML = rows + `<button class="week-expand-close" data-close-week="${week}">Tutup ▲</button>`;
  cardEl.insertAdjacentElement('afterend', wrap);
  if(uiState.expandedDay && uiState.expandedDay.week === week){
    const dw = wrap.querySelector(`[data-detail-for="${week}_${uiState.expandedDay.dayIdx}"]`);
    if(dw) dw.innerHTML = renderFullDayBlock(week, uiState.expandedDay.dayIdx);
  }
}

  }
  if(dss < 0){
    el.innerHTML = `<h1 style="font-size:22px;">Hari Ini</h1><p style="color:var(--text-dim);margin-top:10px;">Program akan dimulai pada ${fmtDateLong(dateForGlobalIdx(0))} (${-dss} hari lagi). Siapkan dirimu! 🚀</p>`;
    return;
  }
  if(dss > 167){
    el.innerHTML = `<h1 style="font-size:22px;">Hari Ini</h1><p style="color:var(--text-dim);margin-top:10px;">🎉 Program 24 minggu sudah selesai! Buka Timeline untuk mereview hari mana pun, atau cek Statistik untuk melihat perjalananmu.</p>`;
    return;
  }
  const idx = Math.min(dss, 167);
  const {week, dayIdx} = globalIdxToWeekDay(idx);
  const d = getDayData(week, dayIdx);

  let prevHtml = '<div class="preview-card"><div class="pv-lbl">Kemarin</div><div class="pv-topic">—</div></div>';
  if(idx > 0){
    const {week:pw, dayIdx:pd} = globalIdxToWeekDay(idx-1);
    const pData = getDayData(pw, pd);
    const pProg = getProgress(pw, pd);
    const st = pProg.holiday ? '📅 Dilewati (Libur)' : (pProg.completed ? '✅ Selesai' : '❌ Belum selesai');
    prevHtml = `<div class="preview-card"><div class="pv-lbl">Kemarin (${pData.day})</div><div class="pv-topic">${pData.topic}</div><div class="pv-status">${st}</div></div>`;
  }
  let nextHtml = '<div class="preview-card"><div class="pv-lbl">Besok</div><div class="pv-topic">Program selesai</div></div>';
  if(idx < 167){
    const {week:nw, dayIdx:nd} = globalIdxToWeekDay(idx+1);
    const nData = getDayData(nw, nd);
    nextHtml = `<div class="preview-card"><div class="pv-lbl">Besok (${nData.day})</div><div class="pv-topic">${nData.topic}</div></div>`;
  }

  el.innerHTML = `
    <h1 style="font-size:22px;margin-bottom:2px;">Hari Ini</h1>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:14px;">${fmtDateLong(dateForGlobalIdx(idx))} · Minggu ${week}, ${d.day}</p>
    <div class="preview-strip">${prevHtml}${nextHtml}</div>
    <div id="todayDayBlock">${renderFullDayBlock(week, dayIdx)}</div>
  `;
}

let syllabusCoverageCache = null;
function buildSyllabusCoverageIndex(){
  if(syllabusCoverageCache) return syllabusCoverageCache;
  const idx = {};
  scheduleData.forEach(w => {
    w.days.forEach((d, dIdx) => {
      (d.syllabusSubtopic || []).forEach(s => {
        if(!idx[s]) idx[s] = {week: w.week, dayIdx: dIdx, dayName: d.day};
      });
    });
  });
  syllabusCoverageCache = idx;
  return idx;
}
function categoryBadgeHtml(cat){
  if(!cat) return '';
  const map = {'Theory':'📖 Theory', 'Practice':'🛠️ Practice', 'Both':'📖🛠️ Both'};
  return `<span class="cat-badge">${map[cat] || cat}</span>`;
}
function renderSilabus(){
  const el = document.getElementById('view-silabus');
  const coverage = buildSyllabusCoverageIndex();
  let totalSub = 0, coveredSub = 0;
  officialSyllabus.forEach(sec => sec.subtopics.forEach(([name]) => { totalSub++; if(coverage[name]) coveredSub++; }));

  const sectionsOrder = [];
  const bySection = {};
  officialSyllabus.forEach(row => {
    if(!bySection[row.section]){ bySection[row.section] = []; sectionsOrder.push(row.section); }
    bySection[row.section].push(row);
  });

  const sectionsHtml = sectionsOrder.map((secName, si) => {
    const topics = bySection[secName];
    let secTotal = 0, secCovered = 0;
    topics.forEach(t => t.subtopics.forEach(([name]) => { secTotal++; if(coverage[name]) secCovered++; }));
    const topicsHtml = topics.map(t => {
      const rows = t.subtopics.map(([name, cat]) => {
        const cov = coverage[name];
        const status = cov ? '✅' : '⚠️';
        const jumpAttr = cov ? `data-jump-week="${cov.week}" data-jump-day="${cov.dayIdx}"` : '';
        const jumpLabel = cov ? `<span class="sy-jump">M${cov.week} · ${cov.dayName}</span>` : '<span class="sy-jump">belum terjadwal</span>';
        return `<div class="syllabus-row" ${jumpAttr}>
          <span class="sy-status">${status}</span>
          <span class="sy-name">${name}</span>
          ${categoryBadgeHtml(cat)}
          ${jumpLabel}
        </div>`;
      }).join('');
      return `<div class="syllabus-topic-group"><div class="stg-title">${t.topic}</div>${rows}</div>`;
    }).join('');
    return `<div class="syllabus-section-card" data-sec-idx="${si}">
      <div class="syllabus-section-head" data-toggle-sec="${si}">
        <h4>${secName}</h4>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="ssh-meta">${secCovered}/${secTotal} terjadwal</span>
          <span class="ssh-chevron">▾</span>
        </div>
      </div>
      <div class="syllabus-section-body">${topicsHtml}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <h1 style="font-size:22px;margin-bottom:4px;">📜 Silabus IOAI</h1>
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:16px;">${coveredSub}/${totalSub} subtopik resmi sudah terjadwalkan di 24 minggu. Klik baris mana pun untuk lompat ke jadwalnya.</p>
    <div class="syllabus-note">${syllabusMeta.note}<br><br>Sumber resmi: <a href="${syllabusMeta.sourceUrl}" target="_blank" rel="noopener">${syllabusMeta.sourceUrl}</a></div>
    ${sectionsHtml}
  `;
  const first = el.querySelector('.syllabus-section-card');
  if(first) first.classList.add('open');
}

let sourceIndexCache = null;
function buildSourceIndex(){
  if(sourceIndexCache) return sourceIndexCache;
  const list = [];
  scheduleData.forEach(w => {
    w.days.forEach((d, dIdx) => {
      list.push({ ref:{week:w.week, dayIdx:dIdx, slot:'mandatory'}, phase:w.phase, weekNum:w.week, dayName:d.day, ...d.sources.mandatory, isMandatory:true });
      d.sources.optional.forEach((o, oIdx) => {
        list.push({ ref:{week:w.week, dayIdx:dIdx, slot:'optional', idx:oIdx}, phase:w.phase, weekNum:w.week, dayName:d.day, ...o, isMandatory:false });
      });
    });
  });
  sourceIndexCache = list;
  return list;
}
function isSourceOpened(item){
  const p = getProgress(item.weekNum, item.ref.dayIdx);
  if(item.isMandatory) return p.mandatoryRead;
  return p.optionalViewed[item.ref.idx];
}

/* ================= Export / Import ================= */
async function doExport(){
  const data = JSON.stringify(appState, null, 2);
  const filename = 'ioai_tracker_backup_' + new Date().toISOString().slice(0,10) + '.json';
  let done = false;
  try{
    if(typeof claude !== 'undefined' && claude.use){
      const downloads = await claude.use('downloads');
      if(downloads){
        await downloads.save({filename, data});
        done = true;
      }
    }
  }catch(e){ console.error(e); }
  if(!done){
    try{
      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      done = true;
    }catch(e){ console.error(e); }
  }
  if(done){
    appState.lastBackup = new Date().toISOString();
    saveState();
    toast('Backup berhasil diunduh ✅');
  } else {
    toast('Gagal membuat file backup.');
  }
}
function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('invalid');
      appState = Object.assign(defaultState(), parsed);
      saveState();
      applyTheme();
      updateAvatar();
      sourceIndexCache = null;
      renderView(uiState.currentView || 'dashboard');
      toast('Import berhasil ✅');
    }catch(err){
      toast('File backup tidak valid ❌');
    }
  };
  reader.readAsText(file);
}

/* ================= Event delegation ================= */
function initEvents(){
  document.body.addEventListener('click', (e) => {
    const viewBtn = e.target.closest('button[data-view], a[data-view]');
    if(viewBtn){ switchView(viewBtn.dataset.view); return; }

    if(e.target.closest('#themeToggle')){
      appState.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('ioai_theme_pref', appState.theme);
      applyTheme(); saveState(); return;
    }
    if(e.target.closest('#menuToggle')){
      document.getElementById('menuPop').classList.toggle('open'); return;
    }
    if(!e.target.closest('#menuPop') && !e.target.closest('#menuToggle')){
      document.getElementById('menuPop').classList.remove('open');
    }
    if(e.target.closest('#btnExport')){ doExport(); document.getElementById('menuPop').classList.remove('open'); return; }
    if(e.target.closest('#btnImport')){ document.getElementById('importFile').click(); document.getElementById('menuPop').classList.remove('open'); return; }

    const themeChoice = e.target.closest('[data-theme-choice]');
    if(themeChoice){
      document.querySelectorAll('.theme-opt').forEach(b=>b.classList.remove('selected'));
      themeChoice.classList.add('selected');
      themeChoice.dataset._picked = '1';
      window.__onboardTheme = themeChoice.dataset.themeChoice; localStorage.setItem('ioai_theme_pref', window.__onboardTheme); applyTheme();
      return;
    }
    if(e.target.closest('#btnStartOnboard')){
      const dateVal = document.getElementById('startDateInput').value;
      const nameVal = document.getElementById('nameInput').value.trim();
      appState.startDate = dateVal || toISODateInput(nextMonday());
      appState.theme = window.__onboardTheme || 'dark';
      appState.userName = nameVal;
      saveState(); applyTheme(); updateAvatar(); hideOnboarding();
      switchView('dashboard');
      checkBackupReminder();
      return;
    }

    const weekCard = e.target.closest('.week-card');
    if(weekCard){ toggleWeekExpand(Number(weekCard.dataset.week), weekCard); return; }
    const closeBtn = e.target.closest('[data-close-week]');
    if(closeBtn){
      const existing = document.querySelector('.week-expand');
      if(existing) existing.remove();
      document.querySelectorAll('.week-card').forEach(c=>c.classList.remove('is-open'));
      uiState.expandedWeek = null; uiState.expandedDay = null;
      return;
    }
    const dayRow = e.target.closest('.day-row');
    if(dayRow){
      const week = Number(dayRow.dataset.week), dayIdx = Number(dayRow.dataset.day);
      const detailWrap = dayRow.nextElementSibling;
      if(uiState.expandedDay && uiState.expandedDay.week===week && uiState.expandedDay.dayIdx===dayIdx){
        detailWrap.innerHTML = ''; uiState.expandedDay = null;
      } else {
        document.querySelectorAll('.day-detail-wrap').forEach(w2=>w2.innerHTML='');
        detailWrap.innerHTML = renderFullDayBlock(week, dayIdx);
        uiState.expandedDay = {week, dayIdx};
      }
      return;
    }

    const checkRow = e.target.closest('.check-row');
    if(checkRow){
      const week = Number(checkRow.dataset.week), dayIdx = Number(checkRow.dataset.day), idx = Number(checkRow.dataset.idx);
      const p = getProgress(week, dayIdx);
      p.checklist[idx] = !p.checklist[idx];
      saveState();
      refreshDayCardInPlace(week, dayIdx);
      return;
    }
    const mandToggle = e.target.closest('[data-mandatory-toggle]');
    if(mandToggle){
      const week = Number(mandToggle.dataset.week), dayIdx = Number(mandToggle.dataset.day);
      const p = getProgress(week, dayIdx);
      p.mandatoryRead = !p.mandatoryRead;
      saveState();
      refreshDayCardInPlace(week, dayIdx);
      return;
    }
    const mandHint = e.target.closest('[data-mandatory-hint]');
    if(mandHint){
      const week = Number(mandHint.dataset.week), dayIdx = Number(mandHint.dataset.day);
      const m = getDayData(week, dayIdx).sources.mandatory;
      openHintModal(m.name, m.searchHint || 'Sumber ini belum memiliki tautan langsung. Coba cari secara manual.');
      return;
    }
    const mandOpenLink = e.target.closest('[data-mandatory-open]');
    if(mandOpenLink){
      // allow default navigation, nothing extra needed
    }
    const optChip = e.target.closest('.opt-chip');
    if(optChip){
      const week = Number(optChip.dataset.week), dayIdx = Number(optChip.dataset.day), oIdx = Number(optChip.dataset.optidx);
      const p = getProgress(week, dayIdx);
      const o = getDayData(week, dayIdx).sources.optional[oIdx];
      p.optionalViewed[oIdx] = true;
      saveState();
      if(o.url){ window.open(o.url, '_blank', 'noopener'); }
      else { openHintModal(o.name, o.searchHint || 'Sumber ini belum memiliki tautan langsung. Coba cari secara manual.'); }
      refreshDayCardInPlace(week, dayIdx);
      return;
    }
    const completeBtn = e.target.closest('[data-complete]');
    if(completeBtn){
      const week = Number(completeBtn.dataset.week), dayIdx = Number(completeBtn.dataset.day);
      const p = getProgress(week, dayIdx);
      let justCompleted = false;
      if(p.completed){ p.completed = false; p.completedAt = null; }
      else if(isEligibleComplete(week, dayIdx)){ p.completed = true; p.holiday = false; p.completedAt = new Date().toISOString(); justCompleted = true; }
      saveState();
      refreshDayCardInPlace(week, dayIdx);
      if(uiState.currentView === 'dashboard') renderDashboard();
      if(uiState.currentView === 'timeline') renderTimeline();
      if(justCompleted){
        confettiBurst();
        let weekFullyDone = true;
        for(let i=0;i<7;i++){ const pp = getProgress(week,i); if(!(pp.completed || pp.holiday)){ weekFullyDone = false; break; } }
        if(weekFullyDone) toast('Minggu ' + week + ' selesai! 🎉');
        checkAndUnlockBadges();
      }
      return;
    }
    const holidayBtn = e.target.closest('[data-holiday]');
    if(holidayBtn){
      const week = Number(holidayBtn.dataset.week), dayIdx = Number(holidayBtn.dataset.day);
      const p = getProgress(week, dayIdx);
      p.holiday = !p.holiday;
      if(p.holiday){ p.completed = false; p.completedAt = null; }
      saveState();
      refreshDayCardInPlace(week, dayIdx);
      return;
    }
    const revealHint = e.target.closest('[data-reveal-hint]');
    if(revealHint){
      revealHint.closest('.quiz-q').classList.toggle('revealed');
      return;
    }
    const saveQuiz = e.target.closest('[data-save-quiz]');
    if(saveQuiz){
      const week = Number(saveQuiz.dataset.saveQuiz);
      const input = document.getElementById('quizScoreInput_'+week);
      const w = getWeekData(week);
      let val = Number(input.value);
      if(isNaN(val) || val < 0) val = 0;
      if(val > w.quiz.length) val = w.quiz.length;
      appState.quizScores[week] = { score: val, total: w.quiz.length, date: new Date().toISOString() };
      saveState();
      toast('Skor kuis Minggu ' + week + ' tersimpan ✅');
      return;
    }
    const cpStatusBtn = e.target.closest('[data-cp-status]');
    if(cpStatusBtn && !cpStatusBtn.disabled){
      const row = cpStatusBtn.closest('.cp-status-row');
      row.querySelectorAll('.cp-status-opt').forEach(b=>b.classList.remove('selected','ready','remedial'));
      const st = cpStatusBtn.dataset.cpStatus;
      cpStatusBtn.classList.add('selected', st);
      row.dataset.selected = st;
      return;
    }
    const saveCp = e.target.closest('[data-save-checkpoint]');
    if(saveCp){
      const week = Number(saveCp.dataset.saveCheckpoint);
      const block = saveCp.closest('.checkpoint-block');
      const answers = Array.from(block.querySelectorAll('[data-cp-answer]')).map(t=>t.value);
      const statusRow = block.querySelector('.cp-status-row');
      const status = statusRow.dataset.selected;
      if(!status){ toast('Pilih status Siap Lanjut / Perlu Remedial dulu.'); return; }
      let remedialItems = [];
      if(status === 'remedial'){
        const w = getWeekData(week);
        w.days.forEach(dd => {
          const dp = getProgress(week, w.days.indexOf(dd));
          dd.checklist.forEach((item, ci) => { if(!dp.checklist[ci]) remedialItems.push(dd.day + ': ' + item.text); });
        });
      }

      saveState();
      // re-render wherever this block lives
      if(uiState.currentView === 'today') renderToday();
      else refreshDayCardInPlace(week, 6);

      return;
    }

    }
    const jumpBtn = e.target.closest('[data-jump-week]');
    if(jumpBtn){

        if(card){
          openWeekExpand(week, card);
          card.scrollIntoView({behavior:'smooth', block:'center'});
          setTimeout(()=>{
            const row = document.querySelector(`.day-row[data-week="${week}"][data-day="${dayIdx}"]`);
            if(row) row.click();
          }, 120);
        }
      }, 60);
      return;
    }

      return;
    }
  });

  document.body.addEventListener('change', (e) => {
    if(e.target.id === 'importFile'){
      const file = e.target.files[0];
      if(file) handleImportFile(file);

      return;
    }
    if(e.target.id === 'filterPhase'){ uiState.sourceFilters.phase = e.target.value; renderSources(); return; }

  });

    if(e.target.id === 'filterSearch'){ uiState.sourceFilters.search = e.target.value; renderSources(); return; }

      uiState.timelineSearch = e.target.value;

}

function refreshDayCardInPlace(week, dayIdx){
  const todayBlock = document.getElementById('todayDayBlock');
  if(todayBlock && uiState.currentView === 'today'){
    const dss = daysSinceStart();
    if(dss !== null && dss >= 0 && dss <= 167){
      const cur = globalIdxToWeekDay(Math.min(dss,167));
      if(cur.week === week && cur.dayIdx === dayIdx){ todayBlock.innerHTML = renderFullDayBlock(week, dayIdx); return; }
    }
  }
  const detailWrap = document.querySelector(`.day-detail-wrap[data-detail-for="${week}_${dayIdx}"]`);

}

function openHintModal(title, hint){
  document.getElementById('hintModalTitle').textContent = title;
  document.getElementById('hintModalText').textContent = hint;
  document.getElementById('hintModal').classList.remove('hidden');
}

    showOnboarding();
  } else {
    switchView('dashboard');

    checkAndUnlockBadges();

}

<script>
/* ===== Timeline mode Agenda: lihat semua hari ke depan (dan yang lalu) tanpa menunggu harinya ===== */
(function(){
const gridRender = renderTimeline;
const st = () => uiState;
renderTimeline = function(){
  st().tlMode = st().tlMode || 'agenda';
  if(st().tlMode === 'grid'){
    gridRender();
    const el = document.getElementById('view-timeline');
    el.insertAdjacentHTML('afterbegin', toggle());

  }

};
const toggle = () => '<div class="ag-tabs"><button data-tlmode="agenda" class="'+(st().tlMode==='agenda'?'on':'')+'">Agenda</button><button data-tlmode="grid" class="'+(st().tlMode==='grid'?'on':'')+'">Per minggu</button><button data-goview="silabus" class="ag-link">Silabus lengkap</button></div>';

function agenda(){
  const el = document.getElementById('view-timeline'), u = st();

  const q = (u.agSearch||'').toLowerCase().trim();
  let done=0, hol=0, late=0, wkDone=0, wkNow=null;
  for(let i=0;i<168;i++){ const m=globalIdxToWeekDay(i), p=getProgress(m.week,m.dayIdx); if(p.completed) done++; if(p.holiday) hol++; if(!p.completed&&todayIdx!==null&&i<todayIdx) late++; }
  if(todayIdx!==null){ wkNow=Math.floor(todayIdx/7)+1; for(let i=0;i<7;i++){ if(getProgress(wkNow,i).completed) wkDone++; } }
  const pct=Math.round(done/168*100);

   +'<div class="ag-sum"><div class="ag-big">'+done+'<small> / 168 hari selesai</small></div><div class="ag-track"><i style="width:'+pct+'%"></i></div><p>'+pct+'%'+(hol?' · '+hol+' hari libur':'')+(wkNow?' · Minggu ini '+wkDone+'/7':'')+' · '+Att.count()+' file terunggah</p></div>'
   +'<div class="ag-filters">'
   +(todayIdx!==null?'<button data-agjump="0">Hari ini</button><button data-agjump="1">Besok</button><button data-agjump="2">Lusa</button>':'')
   +'<select id="agWeek" aria-label="Filter minggu"><option value="">Semua minggu</option>'+scheduleData.map(w=>'<option value="'+w.week+'"'+(String(u.agWeek||'')===String(w.week)?' selected':'')+'>Minggu '+w.week+'</option>').join('')+'</select>'
   +(todayIdx!==null?'<button class="rw-chip'+(u.agLate?' on':'')+'" data-aglate="1">Tertinggal ('+late+')</button>':'')+'<label class="ag-chk"><input type="checkbox" id="agHide"'+(u.agHide?' checked':'')+'> Sembunyikan yang selesai</label>'
   +'<input type="search" id="agSearch" placeholder="Cari topik, mis. ResNet" value="'+(u.agSearch||'').replace(/"/g,'&quot;')+'"></div><div class="ag-list">';
  let shown=0;
  scheduleData.forEach(w=>{
    if(u.agWeek && String(u.agWeek)!==String(w.week)) return;
    let rows='', wd=0;
    w.days.forEach((d,i)=>{
      const p=getProgress(w.week,i); if(p.completed) wd++;
      if(u.agHide && p.completed) return;
      if(u.agLate && !(todayIdx!==null && weekDayToGlobalIdx(w.week,i)<todayIdx && !p.completed)) return;
      if(q && !(d.topic.toLowerCase().includes(q) || w.theme.toLowerCase().includes(q) || (d.sources.mandatory.name||'').toLowerCase().includes(q))) return;

      const stt=p.completed?'<span class="ag-ok">Selesai</span>':p.holiday?'<span class="ag-wn">Libur</span>':(todayIdx!==null&&gi<todayIdx?'<span class="ag-wn">Terlewat</span>':'<span class="ag-mu">Belum</span>');
      const nf=(p.attachments||[]).length;
      rows+='<div class="day-row ag-row'+(tag?' ag-hl':'')+'" data-week="'+w.week+'" data-day="'+i+'"><div class="dr-date">'+(appState.startDate?fmtDateShort(dateForGlobalIdx(gi)):'—')+'<br>'+d.day.slice(0,3)+'</div><div class="ag-main"><div class="ag-topic">'+d.topic+'</div><div class="ag-sub">Wajib: '+(d.sources.mandatory.name||'-')+' · '+(d.duration||'')+(nf?' · '+nf+' file':'')+'</div></div><div class="ag-st">'+(tag?'<b class="ag-tag">'+tag+'</b>':'')+stt+'</div></div><div class="day-detail-wrap" data-detail-for="'+w.week+'_'+i+'"></div>';
      shown++;
    });
    if(rows) h+='<div class="ag-week"><b>Minggu '+w.week+'</b> '+w.theme+' <span>'+w.phase+' · '+wd+'/7</span></div>'+rows;
  });
  if(!shown) h+='<p class="empty-msg">Tidak ada hari yang cocok dengan filter.</p>';
  el.innerHTML=h+'</div>';
  if(u.agFocus){ const f=el.querySelector('#agSearch'); f.focus(); f.setSelectionRange(f.value.length,f.value.length); u.agFocus=false; }
  if(u.expandedDay){ const dw=el.querySelector('[data-detail-for="'+u.expandedDay.week+'_'+u.expandedDay.dayIdx+'"]'); if(dw) dw.innerHTML=renderFullDayBlock(u.expandedDay.week,u.expandedDay.dayIdx); }
  if(!u.agScrolled && todayIdx!==null && !u.agWeek && !q){ u.agScrolled=true; const m=globalIdxToWeekDay(todayIdx), r=el.querySelector('.day-row[data-week="'+m.week+'"][data-day="'+m.dayIdx+'"]'); if(r) setTimeout(()=>r.scrollIntoView({block:'center'}),60); }
}
function jump(off){
  const dss=daysSinceStart(); if(dss===null||dss<0) return;
  const gi=Math.min(dss+off,167), m=globalIdxToWeekDay(gi), u=st();
  if(u.agWeek||u.agHide||u.agSearch||u.agLate){ u.agWeek='';u.agHide=false;u.agSearch='';u.agLate=false; renderTimeline(); }
  const r=document.querySelector('.day-row[data-week="'+m.week+'"][data-day="'+m.dayIdx+'"]'); if(!r) return;
  if(!r.nextElementSibling.innerHTML.trim()) r.click();

let t=0;
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-aglate]'); if(l){ st().agLate=!st().agLate; renderTimeline(); return; }
  const a=e.target.closest('[data-tlmode]'); if(a){ st().tlMode=a.dataset.tlmode; renderTimeline(); return; }
  const g=e.target.closest('[data-goview]'); if(g){ switchView(g.dataset.goview); return; }
  const j=e.target.closest('[data-agjump]'); if(j) jump(+j.dataset.agjump);

document.addEventListener('change',e=>{
  if(e.target.id==='agWeek'){ st().agWeek=e.target.value; renderTimeline(); }
  else if(e.target.id==='agHide'){ st().agHide=e.target.checked; renderTimeline(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='agSearch'){ clearTimeout(t); const v=e.target.value; t=setTimeout(()=>{ st().agSearch=v; st().agFocus=true; renderTimeline(); },250); }
});
})();
</script>
<script>

(function(){
