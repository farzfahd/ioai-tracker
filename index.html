<script>
/* ===== Panduan hari ini: langkah konkret + checklist 3 item ===== */
(function(){
scheduleData.forEach(w=>w.days.forEach(d=>{
  d.checklist=[{text:'Sudah belajar',done:false},{text:'Catatan ditulis',done:false},{text:'File hasil diunggah',done:false}];
  d.output=(d.output||'').replace(/\s*\+\s*hasil latihan soal/i,'').replace(/Skor Self-Quiz Mingguan \+ catatan evaluasi minggu ini\./,'Rangkuman satu halaman minggu ini + daftar hal yang belum dipahami.').replace(/Skor kuis \+ hasil Checkpoint Reflektif/,'Hasil Checkpoint Reflektif');
}));
isEligibleComplete=function(w,i){ const p=getProgress(w,i); return !!p.checklist[0] && !!p.mandatoryRead; };
const TIP={video:'Tonton sambil jeda tiap konsep baru dan tulis istilahnya.',paper:'Baca berurutan: abstrak, gambar/tabel utama, kesimpulan, baru metode.',notebook:'Jalankan sel demi sel, ubah satu parameter dan amati perubahannya.',artikel:'Baca sambil mencoba contoh yang ada; tulis ulang bagian sulit dengan kata sendiri.',course:'Ikuti materinya sambil mencoba contoh; tulis ulang bagian sulit dengan kata sendiri.'};
const SAVE='Unggah foto/file hasil ke Lampiran, lalu centang checklist.';
const PL={
 concept:[[55,'Pelajari sumber wajib','@'],[25,'Tulis ringkasan','5-10 poin dengan kata-kata sendiri, sertakan satu contoh atau gambar sederhana.'],[10,'Isi refleksi singkat','Jawab tiga hal: ide utama, yang belum dipahami, yang ingin dicoba berikutnya.'],[10,'Simpan hasil',SAVE]],
 paper:[[15,'Skim paper','Baca abstrak, gambar/tabel utama, dan kesimpulan. @'],[40,'Baca metode dan hasil','Tandai bagian yang belum dipahami; jangan berhenti di rumus pertama yang sulit.'],[30,'Ringkas dan gambar ulang','Tulis kontribusi utama dan motivasi, lalu gambar ulang diagram kuncinya dengan tangan.'],[15,'Refleksi dan simpan',SAVE]],
 practice:[[40,'Jalankan notebook','@'],[35,'Tulis ulang bagian kunci sendiri','Ketik ulang tanpa copy-paste, ubah satu bagian, lihat hasilnya.'],[15,'Catat error dan insight','Tulis error yang muncul dan cara memperbaikinya.'],[10,'Simpan hasil','Unggah file .ipynb ke Lampiran (jenis Notebook), lalu centang.']],
 review:[[40,'Baca ulang catatan minggu ini','Buka tab Riwayat dan baca catatan tiap hari minggu ini.'],[35,'Tulis rangkuman satu halaman','Lima hal terpenting minggu ini, dengan kata sendiri.'],[25,'Daftar hal yang belum paham','Catat yang masih bingung; kejar lewat filter Tertinggal atau minggu depan.']],
 other:[[60,'Kerjakan sesuai topik','@'],[25,'Tulis catatan hasil','Apa yang berhasil dan apa yang sulit.'],[15,'Simpan hasil',SAVE]]
};
const DONE={concept:t=>'Anda bisa menjelaskan “'+t+'” dalam tiga kalimat tanpa melihat catatan.',paper:t=>'Anda bisa menceritakan masalah, ide, dan hasil utama paper ini tanpa melihat catatan.',practice:()=>'Notebook berjalan dari awal sampai akhir tanpa error dan Anda bisa menjelaskan tiap bagian.',review:()=>'Anda punya daftar hal yang belum dipahami untuk dikejar berikutnya.',other:t=>'Anda punya catatan dan hasil yang bisa dijelaskan untuk “'+t+'”.'};
function mins(d){ const m=(d.duration||'').match(/(\d+(?:[.,]\d+)?)/); const n=m?parseFloat(m[1].replace(',','.')):1; return /menit/i.test(d.duration||'')?n:n*60; }
function plan(w,i){
  const d=getDayData(w,i), k=PL[d.archetype]?d.archetype:'other', T=mins(d), m=d.sources.mandatory, tip=TIP[m.type]||TIP.artikel;
  const li=PL[k].map(s=>{ const min=Math.max(5,Math.round(T*s[0]/100/5)*5), det=s[2].replace('@','Sumber wajib: “'+m.name+'”. '+tip);
    return '<li><div><b>'+s[1]+'</b><br><span>'+det+'</span></div><span class="pm">'+min+' mnt</span></li>'; }).join('');
  return '<div class="plan"><h4>Yang dikerjakan hari ini</h4><ol>'+li+'</ol><p class="done"><b>Hari ini selesai jika:</b> '+DONE[k](d.topic)+'</p><p class="done"><b>Waktu mepet?</b> Cukup sumber wajib + centang “Sudah belajar”; sisanya bisa dikejar lewat filter Tertinggal.</p><button class="ag-link2" data-notetpl="'+w+'_'+i+'">Isi kerangka catatan</button></div>';
}
const _f=renderFullDayBlock;
renderFullDayBlock=function(w,i){ const h=_f(w,i); return h.replace('<div class="checklist">',plan(w,i)+'<div class="checklist">'); };
document.addEventListener('input',e=>{ const t=e.target; if(t.matches&&t.matches('[data-notes]')){ getProgress(+t.dataset.week,+t.dataset.day).notes=t.value; saveStateDebounced(); } });
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-notetpl]'); if(!b) return;
  const [w,i]=b.dataset.notetpl.split('_'), ta=document.querySelector('.notes-area[data-week="'+w+'"][data-day="'+i+'"]'); if(!ta) return;
  const tpl='Ide utama:\n- \n\nYang belum saya pahami:\n- \n\nYang ingin saya coba berikutnya:\n- ';
  ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n\n':'')+tpl; ta.dispatchEvent(new Event('input',{bubbles:true})); ta.focus(); ta.scrollIntoView({block:'center',behavior:'smooth'});
});
})();
</script>
<script type="module">
/* ================= Cloud sync (Firebase Auth + Firestore) ================= */
/* Isi firebaseConfig dari Firebase Console (lihat PANDUAN_FIREBASE_GITHUB_PAGES.md) */
const firebaseConfig = {
  apiKey: "AIzaSyDrwpN90p-YeqWt1d06_FS4NMems1h7-BE",
  authDomain: "track-ioai.firebaseapp.com",
  projectId: "track-ioai",
  storageBucket: "track-ioai.firebasestorage.app",
  messagingSenderId: "939986827799",
  appId: "1:939986827799:web:f1b1103cbf345b937bfa52"
};

//
const V = '10.14.1', G = 'https://www.gstatic.com/firebasejs/' + V + '/';
const $ = id => document.getElementById(id);
const str = o => JSON.stringify(o, (k,v) => k === '_u' ? undefined : v);
const SNAP = { progress:{}, checkpoints:{}, settings:'' };
let firstSync = false, fb = null, user = null, wasIn = false, unsubs = [], pending = false, pushT = null;

function chip(t, cls){ const c = $('syncChip'); if(c){ c.textContent = t; c.className = 'sync-chip ' + (cls||''); } }
function authBtn(){ const o = $('btnCloudOnboard'); if(o) o.textContent = user ? '✅ Masuk sebagai ' + (user.displayName||user.email) : '☁️ Sudah punya data? Masuk dengan Google';
  const b = $('btnCloudAuth'); if(b) b.textContent = user ? '🚪 Keluar (' + (user.displayName||user.email) + ')' : '☁️ Masuk dengan Google'; }
function status(){
  if(!user) return chip('☁️ Lokal saja');
  if(!navigator.onLine) return chip('📴 Offline · tersimpan lokal', 'off');
  chip(pending ? '🔄 Menyinkronkan…' : '✅ Tersinkron', pending ? '' : 'ok');
}
const blank = p => !p || (!p.completed && !p.holiday && !p.notes && !p.mandatoryRead && !(p.checklist||[]).some(Boolean) && !(p.optionalViewed||[]).some(Boolean) && !(p.attachments||[]).length);
const settingsOf = () => ({ startDate:appState.startDate, theme:appState.theme, userName:appState.userName, lastBackup:appState.lastBackup, unlockedBadges:appState.unlockedBadges });
const ref = (kind, id) => fb.doc(fb.db, 'users', user.uid, kind, id);

async function loadSdk(){
  if(fb) return true;
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('ISI')){ toast('Firebase belum dikonfigurasi. Isi firebaseConfig (lihat panduan).'); return false; }
  try{
    const [a, au, f] = await Promise.all([import(G+'firebase-app.js'), import(G+'firebase-auth.js'), import(G+'firebase-firestore.js')]);
    const app = a.initializeApp(firebaseConfig);
    const db = f.initializeFirestore(app, { localCache: f.persistentLocalCache({ tabManager: f.persistentMultipleTabManager() }) });
    fb = { ...f, db, auth: au.getAuth(app), au };
    au.onAuthStateChanged(fb.auth, onAuth);
    return true;
  }catch(e){ console.error(e); toast('Gagal memuat Firebase. Cek koneksi internet, lalu coba lagi.'); return false; }
}

async function login(){
  if(!await loadSdk()) return;
  toast('Membuka jendela login Google…');
  try{ await fb.au.signInWithPopup(fb.auth, new fb.au.GoogleAuthProvider()); }
  catch(e){
    const m = { 'auth/popup-blocked':'Pop-up diblokir. Izinkan pop-up untuk situs ini lalu coba lagi.', 'auth/popup-closed-by-user':'Login dibatalkan.', 'auth/unauthorized-domain':'Domain belum diizinkan di Firebase Authentication (lihat panduan langkah 5).', 'auth/network-request-failed':'Tidak ada koneksi internet.' };
    toast(m[e.code] || 'Login gagal: ' + (e.code || e.message));
  }
}
async function logout(){ try{ await fb.au.signOut(fb.auth); toast('Keluar. Data tetap ada di perangkat ini.'); }catch(e){ toast('Gagal keluar.'); } }

async function onAuth(u){
  unsubs.forEach(x => x()); unsubs = [];
  if(!u){
    user = null; authBtn(); status();
    if(wasIn) toast('Sesi login habis. Masuk lagi agar sinkronisasi berlanjut.');
    wasIn = false; return;
  }
  user = u; wasIn = true; authBtn();
  const last = localStorage.getItem('ioai_cloud_uid');
  if(last && last !== u.uid){ appState = defaultState(); saveLocal(); }
  localStorage.setItem('ioai_cloud_uid', u.uid);
  try{
    const has = (await fb.getDoc(ref('meta','settings'))).exists();
    toast(has ? 'Masuk sebagai ' + (u.displayName||u.email) + '. Mengambil data dari cloud…' : 'Masuk sebagai ' + (u.displayName||u.email) + '. Belum ada data di cloud.');
    const localHas = appState.startDate || Object.values(appState.progress).some(p => !blank(p));
    if(!has && localHas){
      if(confirm('Impor data belajar dari perangkat ini ke cloud?\n\nOK = unggah data lama.\nBatal = data lama tetap di perangkat ini, tidak diunggah.')){
        SNAP.progress = {}; SNAP.checkpoints = {}; SNAP.settings = '';
        toast('Data lama diimpor ke cloud.');
      } else markSynced();
    } else if(!has) markSynced();
  }catch(e){ return syncErr(e); }
  const err = e => syncErr(e);
  unsubs.push(fb.onSnapshot(fb.collection(fb.db,'users',u.uid,'progress'), sn => merge('progress', sn), err));
  unsubs.push(fb.onSnapshot(fb.collection(fb.db,'users',u.uid,'checkpoints'), sn => merge('checkpoints', sn), err));
  unsubs.push(fb.onSnapshot(ref('meta','settings'), sn => mergeSettings(sn), err));
  firstSync = false; status();
}
function markSynced(){
  for(const k in appState.progress) SNAP.progress[k] = str(appState.progress[k]);
  for(const k in appState.checkpoints) SNAP.checkpoints[k] = str(appState.checkpoints[k]);
  SNAP.settings = str(settingsOf());
}
function syncErr(e){
  console.error(e);
  if(e.code === 'permission-denied' || e.code === 'unauthenticated') toast('Akses ditolak. Masuk ulang atau periksa Security Rules.');
  else if(e.code !== 'unavailable') toast('Sinkronisasi bermasalah: ' + (e.code || e.message));
  status();
}
function saveLocal(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); }catch(e){} }
function rerender(){
  const a = document.activeElement;
  if(a && /^(TEXTAREA|INPUT)$/.test(a.tagName)) return;
  if(appState.startDate && !$('onboardModal').classList.contains('hidden')){ hideOnboarding(); switchView('dashboard'); }
  else if(appState.startDate) renderView(uiState.currentView || 'dashboard');
}
function merge(kind, sn){
  pending = sn.metadata.hasPendingWrites; let ch = false;
  sn.docChanges().forEach(c => {
    if(c.doc.metadata.hasPendingWrites) return;
    const id = c.doc.id, d = c.doc.data(), cur = appState[kind][id];
    if(!cur || (d._u||0) > (cur._u||0)){ appState[kind][id] = d; SNAP[kind][id] = str(d); ch = true; }
  });
  if(ch){ saveLocal(); rerender(); } status();
  if(kind === 'progress' && !firstSync){ firstSync = true; Cloud.onLocalSave(); }
}
function mergeSettings(sn){
  if(!sn.exists() || sn.metadata.hasPendingWrites) return;
  const d = sn.data();
  if((d._u||0) > (appState._su||0)){ const { _u, ...rest } = d; Object.assign(appState, rest, { _su:_u }); SNAP.settings = str(settingsOf()); saveLocal(); applyTheme(); updateAvatar(); rerender(); }
}

window.Cloud = {
  onLocalSave(){
    if(!user || !fb) return;
    clearTimeout(pushT); pushT = setTimeout(async () => {
      const now = Date.now(), jobs = [];
      for(const kind of ['progress','checkpoints']){
        for(const [id, v] of Object.entries(appState[kind])){
          if(kind === 'progress' && blank(v)) continue;
          const s = str(v);
          if(SNAP[kind][id] !== s){ v._u = now; SNAP[kind][id] = s; jobs.push(fb.setDoc(ref(kind, id), JSON.parse(JSON.stringify(v)))); }
        }
      }
      const st = str(settingsOf());
      if(SNAP.settings !== st){ appState._su = now; SNAP.settings = st; jobs.push(fb.setDoc(ref('meta','settings'), { ...settingsOf(), _u: now })); }
      if(!jobs.length) return;
      saveLocal(); pending = true; status();
      try{ await Promise.all(jobs); pending = false; status(); }
      catch(e){ pending = false; syncErr(e); }
    }, 700);
  }
};

document.addEventListener('click', e => {
  if(e.target.closest('#btnCloudAuth')){ $('menuPop')?.classList.remove('open'); user ? logout() : login(); }
  else if(e.target.closest('#btnCloudOnboard')) login();
  else if(e.target.closest('#syncChip')) user ? toast(navigator.onLine ? (pending ? 'Perubahan sedang dikirim ke cloud.' : 'Semua data sudah tersinkron.') : 'Offline: perubahan disimpan lokal dan dikirim otomatis saat online.') : login();
});
addEventListener('online', status); addEventListener('offline', status);
if(!firebaseConfig.apiKey.startsWith('ISI')) loadSdk();
</script>
